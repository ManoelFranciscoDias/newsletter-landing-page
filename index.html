<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inscreva-se na newsletter e receba novidades no seu e-mail. Sem spam.">
    <meta name="color-scheme" content="light dark">
    <title>Newsletter</title>

    <script>
        (function () {
            try {
                var salvo = localStorage.getItem("tema");
                var sistemaEscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (salvo === "escuro" || (!salvo && sistemaEscuro)) {
                    document.documentElement.setAttribute("data-tema", "escuro");
                }
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="topo">
        <div class="container">
            <strong>Newsletter</strong>
            <button type="button" id="btnTema" class="btn" aria-pressed="false">Alternar tema</button>
        </div>
    </header>

    <main class="container">
        <section class="caixa">
            <h1>Inscreva-se</h1>
            <p>Receba novidades no seu e-mail. Sem spam.</p>

            <form id="formInscricao" novalidate>
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Seu nome" autocomplete="name" required>

                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="nome@email.com" autocomplete="email" required>

                <button type="submit" class="btn primario">Quero receber</button>

                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <div class="container">
            <small>Newsletter <span id="ano">2025</span></small>
        </div>
    </footer>
</body>
</html>
